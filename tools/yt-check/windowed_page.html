<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NSP windowed page</title>
<style>
  body { margin: 0; font: 15px/1.5 Segoe UI, sans-serif; background: #f4f4f4; color: #222; }
  body.dark { background: #0f0f0f; color: #ddd; }
  header { position: sticky; top: 0; height: 56px; background: rgba(255,255,255,.92); border-bottom: 1px solid #ccc;
           display: flex; align-items: center; padding: 0 16px; z-index: 5; }
  body.dark header { background: rgba(15,15,15,.92); border-color: #333; }
  #stage { position: relative; margin: 40px 0 0 40px; width: 960px; }
  #stage.theater { margin: 20px auto 0; width: 1200px; }
  #glow { position: absolute; left: -80px; top: -60px; width: calc(100% + 160px); height: calc(100% + 120px);
          filter: blur(40px); opacity: .6; z-index: 0; display: none; }
  body.glow #glow { display: block; }
  video { position: relative; display: block; width: 100%; aspect-ratio: 960 / 400; background: #000; z-index: 1; }
  .ytp-size-button { margin-top: 8px; }
  p { max-width: 900px; margin: 18px 40px; }
</style>
</head>
<body>
<header><b>NSP windowed page</b>&nbsp;&nbsp;<input placeholder="search" style="width:300px"></header>
<div id="stage">
  <canvas id="glow" width="96" height="40"></canvas>
  <video id="v" muted loop playsinline></video>
  <button class="ytp-size-button" onclick="document.getElementById('stage').classList.toggle('theater')">theater</button>
</div>
<div id="text"></div>
<script>
// Default CFR WebM source is fixed-timestamp video. `source=canvas` retains the
// older RAF-paced capture source for diagnosing source-side cadence problems.
const q = new URLSearchParams(location.search);
const fps = +(q.get('fps') || 24);
const cfr = q.get('source') === 'cfr';
if (q.get('dark') === '1') document.body.classList.add('dark');
if (q.get('glow') === '1') document.body.classList.add('glow');
const src = document.createElement('canvas');
src.width = 960; src.height = 400;
const g = src.getContext('2d');
const sourceStream = src.captureStream(0);
const sourceTrack = sourceStream.getVideoTracks()[0];
let n = -1;
let startedAt = null;
let lastDrawAt = null;
const drawIntervals = [];
const presentedIntervals = [];
const mediaIntervals = [];
let lastPresentedAt = null;
let lastMediaTime = null;
function draw(frame) {
  const t = frame / fps;
  g.fillStyle = '#203040'; g.fillRect(0, 0, 960, 400);
  for (let i = 0; i < 12; i++) {
    g.fillStyle = `hsl(${i * 30},70%,55%)`;
    const x = (i * 97 + t * 240) % 1100 - 70, y = 30 + i * 28;
    g.fillRect(x, y, 70, 22);
  }
  g.fillStyle = '#fff'; g.font = '28px monospace'; g.fillText('CFR SOURCE TEST', 20, 380);
}
function animate(now) {
  if (startedAt === null) startedAt = now;
  const frame = Math.floor((now - startedAt) * fps / 1000);
  if (frame > n) {
    if (lastDrawAt !== null) {
      drawIntervals.push(now - lastDrawAt);
      if (drawIntervals.length > 120) drawIntervals.shift();
    }
    lastDrawAt = now;
    n = frame;
    draw(frame);
    sourceTrack.requestFrame();
  }
  requestAnimationFrame(animate);
}
function summarize(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const at = p => sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor(p * sorted.length))] : 0;
  const mean = sorted.length ? sorted.reduce((sum, x) => sum + x, 0) / sorted.length : 0;
  return {samples: sorted.length,
          min_ms: +(at(0).toFixed(2)), mean_ms: +(mean.toFixed(2)), median_ms: +(at(.5).toFixed(2)),
          p95_ms: +(at(.95).toFixed(2)), max_ms: +(at(1).toFixed(2))};
}
window.__nspSourceStats = () => ({fps, source: cfr ? 'cfr-webm' : 'canvas',
  callback_intervals: summarize(cfr ? presentedIntervals : drawIntervals),
  ...(cfr ? {media_intervals: summarize(mediaIntervals)} : {})});
if (!cfr) requestAnimationFrame(animate);
const v = document.getElementById('v');
if (cfr) {
  v.src = `generated/cfr_${fps}.webm`;
  const onFrame = (_now, meta) => {
    if (lastPresentedAt !== null) presentedIntervals.push(meta.expectedDisplayTime - lastPresentedAt);
    if (lastMediaTime !== null && meta.mediaTime > lastMediaTime)
      mediaIntervals.push((meta.mediaTime - lastMediaTime) * 1000);
    lastPresentedAt = meta.expectedDisplayTime;
    lastMediaTime = meta.mediaTime;
    if (presentedIntervals.length > 120) presentedIntervals.shift();
    if (mediaIntervals.length > 120) mediaIntervals.shift();
    v.requestVideoFrameCallback(onFrame);
  };
  v.addEventListener('loadeddata', () => v.requestVideoFrameCallback(onFrame), {once: true});
} else {
  v.srcObject = sourceStream;
}
v.play();
// The ambient-mode stand-in: a blurred, enlarged copy of the picture, repainted at 12 Hz.
const glow = document.getElementById('glow').getContext('2d');
setInterval(() => { if (document.body.classList.contains('glow')) glow.drawImage(cfr ? v : src, 0, 0, 96, 40); }, 1000 / 12);
let text = '';
for (let i = 0; i < 40; i++) text += `<p>Paragraph ${i}. Static page text below the video, so the page scrolls.</p>`;
document.getElementById('text').innerHTML = text;
</script>
</body>
</html>
